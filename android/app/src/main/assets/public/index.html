<!doctype html>
<html lang="fa" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kelasam</title>
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="fa">
<meta name="theme-color" content="#12343b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="kelasam">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><img src="icon-192.png" alt="" width="42" height="42"></div><div><b>kelasam</b><small id="brandSub"></small></div></div>
    <div id="nav"></div>
    <div class="sp"></div>
    <div class="tools">
      <button class="nav" id="bInstall" hidden><span class="ic">📲</span>نصب برنامه</button>
      <button class="nav" id="bExportCls"><span class="ic">📊</span>اکسل این کلاس</button>
      <button class="nav" id="bExportAll"><span class="ic">📚</span>اکسل همه کلاس‌ها</button>
      <button class="nav" id="bExport"><span class="ic">💾</span>پشتیبان‌گیری (فایل)</button>
      <button class="nav" id="bAuto"><span class="ic">🕘</span>پشتیبان‌های خودکار</button>
      <button class="nav" id="bImport"><span class="ic">📂</span>بازیابی پشتیبان</button>
      <button class="nav" id="bReset"><span class="ic">🧪</span>داده نمونه (۲ کلاس)</button>
      <button class="nav" id="bClear"><span class="ic">🗑️</span>شروع از صفر</button>
    </div>
    <input type="file" id="fImport" accept=".json" hidden>
  </aside>
  <main>
    <button class="btn sec menu-btn noprint" id="menuBtn" style="margin-bottom:12px">☰ منو</button>
    <div id="view"></div>
  </main>
</div>
<nav class="bottom noprint" id="bottom"></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="chart.umd.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
