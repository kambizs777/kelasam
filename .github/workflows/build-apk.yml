name: Build kelasam APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web files
        run: node prepare.js
      - name: Sync Android project
        run: |
          if [ ! -f android/gradlew ]; then rm -rf android && npx cap add android; fi
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kelasam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
